# =============================================================
#  docker-compose.yml  
# =============================================================

services:

  # ============================================================
  #  CONTAINER 1: SQL Server Database
  # ============================================================
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: glms-sql-server

    environment:
      SA_PASSWORD: "GLMS_Docker_Pass1!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"

    # Port 1433 is only accessible INSIDE the docker network.
    # glms-api can reach it via "sql-server:1433".
    expose:
      - "1433"

    volumes:
      - glms-sql-data:/var/opt/mssql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'GLMS_Docker_Pass1!' -Q 'SELECT 1' -C || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    networks:
      - glms-network

  # ============================================================
  #  CONTAINER 2: GLMS Backend API
  # ============================================================
  glms-api:
    build:
      context: .
      dockerfile: GLMS_API/Dockerfile

    container_name: glms-backend-api

    ports:
      - "8080:8080"

    environment:
      ConnectionStrings__DefaultConnection: "Server=sql-server,1433;Database=GLMS;User Id=sa;Password=GLMS_Docker_Pass1!;TrustServerCertificate=True;Encrypt=False;"

      Firebase__ProjectId: "prog7311glms"
      Firebase__ServiceAccountPath: "/app/secrets/firebase-service-account.json"

      ExchangeRateApi__ApiKey: "${EXCHANGE_RATE_API_KEY}"
      ExchangeRateApi__BaseUrl: "https://v6.exchangerate-api.com/v6/"

      AllowedOrigins__MvcApp: "http://localhost:8081"

      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"

    volumes:
      - ./GLMS_API/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro

    depends_on:
      sql-server:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - glms-network

  # ============================================================
  #  CONTAINER 3: GLMS Frontend MVC
  # ============================================================
  glms-mvc:
    build:
      context: .
      dockerfile: "PROG7311 GLMS MVC/Dockerfile"

    container_name: glms-frontend-web

    ports:
      - "8081:8080"

    environment:
      GlmsApi__BaseUrl: "http://glms-api:8080/"
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"

    depends_on:
      - glms-api

    restart: unless-stopped

    networks:
      - glms-network

# ============================================================
#  VOLUMES
# ============================================================
volumes:
  glms-sql-data:
    driver: local

# ============================================================
#  NETWORKS
# ============================================================
networks:
  glms-network:
    driver: bridge